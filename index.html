<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: three screens per job (pick, measure, results). One question per card, one big button to move on. */
:root{
  color-scheme:dark;
  --bg:#0E1216; --surface:#161C22; --raised:#1E262E; --line:#2B3541; --fg:#E7ECF1; --muted:#93A0AE;
  --accent:#6CB4EE; --on-accent:#08131D; --amber:#F0B045; --teal:#45C2B1;
  --good:#5CCB8F; --warn:#F3806F; --warn-bg:rgba(243,128,111,.12);
  --pa:#22344A; --pb:#2C4460; --seam:#5D7A9E; --ridgec:#F3806F; --valc:#6CB4EE; --hole:#0E1216;
  --bar:rgba(14,18,22,.94);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EDF0F3; --surface:#FFFFFF; --raised:#F3F6F9; --line:#D3DAE2; --fg:#111820; --muted:#566370;
    --accent:#1C6CB0; --on-accent:#FFFFFF; --amber:#9A5A06; --teal:#0E7F71;
    --good:#1F7A4C; --warn:#B4321F; --warn-bg:rgba(180,50,31,.08);
    --pa:#DCE7F4; --pb:#C3D5EA; --seam:#7C93B8; --ridgec:#B4321F; --valc:#1C6CB0; --hole:#FFFFFF;
    --bar:rgba(237,240,243,.95);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EDF0F3; --surface:#FFFFFF; --raised:#F3F6F9; --line:#D3DAE2; --fg:#111820; --muted:#566370;
  --accent:#1C6CB0; --on-accent:#FFFFFF; --amber:#9A5A06; --teal:#0E7F71;
  --good:#1F7A4C; --warn:#B4321F; --warn-bg:rgba(180,50,31,.08);
  --pa:#DCE7F4; --pb:#C3D5EA; --seam:#7C93B8; --ridgec:#B4321F; --valc:#1C6CB0; --hole:#FFFFFF;
  --bar:rgba(237,240,243,.95);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 18px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hide,[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;min-height:60px;margin-inline:-16px;padding-inline:8px 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.topbar h1{margin:0;font:700 26px/1 var(--f-display);letter-spacing:.02em}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:17px;min-height:48px;padding:0 10px}
.view{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.card>h2{margin:0;font:700 24px/1.1 var(--f-display);letter-spacing:.01em}
.hint{margin:0;font-size:16px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:15px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:56px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-size:20px;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:auto}
.unit{position:relative}
.unit .inp{padding-right:44px}
.unit::after{content:attr(data-u);position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--raised);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:52px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:18px;padding:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{display:block;width:100%;min-height:60px;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:20px;background:var(--accent);color:var(--on-accent);text-align:center}
.btn.alt{background:var(--raised);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn-sm{min-height:48px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:8px 14px;font-size:16px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px}
.x{border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;padding:0 6px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .btn{max-width:528px;margin:0 auto}

/* home */
.pick{display:grid;gap:14px}
.pick button{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:120px}
.pick b{font:700 40px/1 var(--f-display);color:var(--accent)}
.pick span{color:var(--muted);font-size:17px}

/* import */
.imp{border-style:dashed}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filebtn{cursor:pointer}
.filebtn.off{opacity:.45;pointer-events:none}
#impFile:focus-visible + .filebtn{outline:3px solid var(--accent);outline-offset:2px}
.imp .st{font-size:16px;color:var(--muted)}
.imp .st:empty{display:none}
.imp .st.err{color:var(--warn)}
.imp .st.ok{color:var(--good)}
.imp ul{margin:6px 0 0;padding-left:20px}

/* outline and wall editors */
.sub{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.sub-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub-h b{font:700 20px/1.1 var(--f-display)}
.erows{display:grid;gap:8px;counter-reset:edge}
.erow{display:grid;grid-template-columns:20px 74px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center;counter-increment:edge}
.erow::before{content:counter(edge);font-size:14px;color:var(--muted);text-align:right}
.erow .inp{min-height:50px;padding:8px;font-size:17px}
.erow .x{font-size:24px;padding:0}
.status{font-size:15px;color:var(--muted)}
.status.err{color:var(--warn);font-weight:600}
.status.ok{color:var(--good)}
.mini>span{font-size:13px}
.mini .inp{min-height:50px;padding:8px 10px;font-size:18px}

/* results */
.callout{margin:0;padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:16px}
.big{margin:0;font:700 64px/.95 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big small{font-size:28px;color:var(--fg);margin-left:6px}
.list{display:grid;grid-template-columns:minmax(6em,1fr) auto;margin:0}
.list dt,.list dd{margin:0;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.list dt{padding-right:12px}
.list dt small{display:block;font-size:14px;color:var(--muted)}
.list dd{text-align:right;font:700 24px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.list .len{font:600 19px/1.3 var(--f-mono)}
.list .tot{color:var(--accent);font-weight:700}
.list dd.tot{font-size:21px}
.cost{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.cost b{font:700 34px/1 var(--f-display);color:var(--good)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 18px}
details.more>summary{cursor:pointer;font-weight:600;min-height:52px;display:flex;align-items:center}
details.more[open]{padding-bottom:18px}
details.more .inner{display:grid;gap:14px}
details.sub2{border-top:1px solid var(--line);padding-top:6px}
details.sub2>summary{cursor:pointer;font-weight:600;min-height:48px;display:flex;align-items:center}
.cuts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cuts li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cuts b{font:500 13px var(--f-mono);color:var(--muted)}
.cuts span{font:600 16px/1.2 var(--f-mono)}
.cuts small{flex-basis:100%;font-size:12px;color:var(--amber)}
.fh{margin:6px 0 0;font-weight:600}
.code{display:inline-block;min-width:30px;padding:1px 7px;margin-right:8px;border-radius:7px;background:var(--accent);color:var(--on-accent);text-align:center;font-size:15px}
.courses{display:grid;gap:6px;font-size:16px}
.courses div{display:grid;grid-template-columns:44px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.courses i{font-style:normal;color:var(--muted);font-size:14px}
.courses span{font-family:var(--f-mono);font-size:15px}
.viewer{background:var(--raised);border-radius:12px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh;border:1px solid var(--line)}
.viewer svg{display:block;width:calc(100% * var(--z,1));height:auto;font-family:var(--f-display);font-weight:600}
.viewer svg text{fill:var(--fg)}
.zoom{display:flex;gap:8px;align-items:center}
.zoom .btn-sm{min-width:52px;font-size:20px}
.zoom span{margin-left:auto;font-size:14px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.key i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:6}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.copyout{width:100%;min-height:200px;font:15px/1.4 var(--f-mono)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="actionbar" id="bar" hidden><button class="btn" id="barBtn"></button></div>
<div class="toast" id="toast" role="status"></div>

<!-- report import lives outside the views so the file input survives re-renders -->
<div class="card imp" id="imp" hidden>
  <p class="hint" style="color:var(--fg)"><strong>Import a HOVER or EagleView report.</strong> Pick the PDF or screenshots of the summary page. Claude reads it and fills in the totals below.</p>
  <input type="file" id="impFile" class="vh" multiple accept="application/pdf,.pdf,image/png,image/jpeg,image/webp">
  <label class="btn alt filebtn" for="impFile" id="impBtn">Choose report or screenshots</label>
  <button class="btn-sm hide" id="impStop">Stop</button>
  <div class="st" id="impSt" aria-live="polite">Getting import ready…</div>
</div>
<script>
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

// ---------- roof layout engine: outline -> faces -> panels ----------
// Sections are walked edge by edge (N/E/S/W + length + eave|rake|wall). With one pitch per section,
// the roof over a rectilinear outline is its straight skeleton, which for right-angle outlines is the
// L-infinity distance to the eaves: a point belongs to the eave whose wavefront reaches it first.
const LDIR={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
function buildRoof(sections,cov,over){
  const R={secs:[],faces:[],area:0,eave:0,rake:0,wall:0,ridge:0,hips:0,valleys:0,panels:0,lf:0,clips:0,pitch:null};
  const H=cov/24;                                    // scan spacing: 24 lines per panel width
  (sections||[]).forEach((sec,si)=>{
    const S={name:sec.name||('Section '+(si+1)),ok:false,msg:'',note:''}; R.secs.push(S);
    const p=+sec.pitch||0, pf=Math.sqrt(1+(p/12)**2);
    const E=(sec.edges||[]).filter(e=>LDIR[e.d]&&+e.len>0);
    if(E.length<4){S.msg='Needs at least 4 edges.';return;}
    const L=E.map(e=>e.t==='rake'?e.len/pf:+e.len);   // rakes are entered along the slope, like the reports show them
    let gx=0,gy=0; E.forEach((e,i)=>{gx+=LDIR[e.d][0]*L[i];gy+=LDIR[e.d][1]*L[i];});
    const gap=(g,pos,neg)=>Math.abs(g)<.05?'':f2(Math.abs(g))+' ft '+(g>0?pos:neg);
    if(Math.abs(gx)>1.5||Math.abs(gy)>1.5){S.msg='Doesn’t close: the last edge ends '+[gap(gx,'east','west'),gap(gy,'south','north')].filter(Boolean).join(' and ')+' of the start.';return;}
    const fixed=[];                                   // report lengths are rounded, so absorb a small gap in the last edge on that axis
    for(const ax of [0,1]){const g=ax?gy:gx; if(Math.abs(g)<1e-6)continue;
      let i=E.length-1; while(i>=0&&LDIR[E[i].d][ax]===0)i--;
      if(i<0){S.msg='Doesn’t close.';return;}
      L[i]-=g*LDIR[E[i].d][ax]; if(L[i]<.05){S.msg='Doesn’t close.';return;}
      if(Math.abs(g)>=.05) fixed.push('edge '+(sec.edges.indexOf(E[i])+1)+' '+(g*LDIR[E[i].d][ax]<0?'+':'−')+f2(Math.abs(g))+' ft');
    }
    if(fixed.length) S.note='Adjusted '+fixed.join(', ')+' so the outline closes.';
    const V=[[+sec.x||0,+sec.y||0]];
    E.forEach((e,i)=>{const q=V[V.length-1];V.push([q[0]+LDIR[e.d][0]*L[i],q[1]+LDIR[e.d][1]*L[i]]);});
    V.pop();
    const inside=pt=>{let c=false;for(let i=0,j=V.length-1;i<V.length;j=i++){const a=V[i],b=V[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;};
    let area2=0; for(let i=0,j=V.length-1;i<V.length;j=i++) area2+=(V[j][0]+V[i][0])*(V[j][1]-V[i][1]);
    const orient=area2>0?1:-1;                        // which side of each edge is inside
    const edges=E.map((e,i)=>{const a=V[i],b=V[(i+1)%V.length],d=LDIR[e.d],ax=d[0]?0:1;
      const nrm=[-d[1]*orient,d[0]*orient];           // interior normal
      const mid=[(a[0]+b[0])/2+nrm[0]*1e-3,(a[1]+b[1])/2+nrm[1]*1e-3];
      if(!inside(mid)){nrm[0]*=-1;nrm[1]*=-1;}
      return {a,b,t:e.t||'eave',ax,nrm,len:L[i]};});
    for(const e of edges){ if(e.t==='eave')R.eave+=e.len; else if(e.t==='rake')R.rake+=e.len*pf; else R.wall+=e.len; }
    // coplanar eaves (same line, same side) are one roof plane
    const G=[];
    for(const e of edges){ if(e.t!=='eave')continue;
      const c=e.ax===0?e.a[1]:e.a[0], n=e.ax===0?e.nrm[1]:e.nrm[0], lo=Math.min(e.a[e.ax],e.b[e.ax]), hi=Math.max(e.a[e.ax],e.b[e.ax]);
      let g=G.find(g=>g.ax===e.ax&&Math.abs(g.c-c)<1e-6&&g.n===n); if(!g){g={ax:e.ax,c,n,segs:[]};G.push(g);} g.segs.push([lo,hi]); }
    if(!G.length){S.msg='Needs at least one eave.';return;}
    const toS=(g,P)=>g.ax===0?P[0]:P[1], toU=(g,P)=>((g.ax===0?P[1]:P[0])-g.c)*g.n;
    const toP=(g,s,u)=>g.ax===0?[s,g.c+g.n*u]:[g.c+g.n*u,s];
    function owner(P){
      if(!inside(P)) return -1;
      let best=-1,bv=Infinity,bd=Infinity;
      for(let k=0;k<G.length;k++){const g=G[k],u=toU(g,P); if(u<-1e-9)continue; const s=toS(g,P);
        let v=Infinity,dd=Infinity; for(const [lo,hi] of g.segs){const d=Math.max(0,lo-s,s-hi),w=Math.max(u,d); if(w<v||(w===v&&d<dd)){v=w;dd=d;}}
        if(v<bv-1e-9||(Math.abs(v-bv)<=1e-9&&dd<bd)){best=k;bv=v;bd=dd;}}
      return best;
    }
    const proj=(g,ax)=>V.map(q=>ax==='s'?toS(g,q):toU(g,q));
    const hAt=P=>{let v=Infinity;for(const g of G){const u=toU(g,P);if(u<-1e-9)continue;const s=toS(g,P);for(const [lo,hi] of g.segs)v=Math.min(v,Math.max(u,lo-s,s-hi));}return v;};
    const xs=V.map(q=>q[0]),ys=V.map(q=>q[1]); let hTop=0;
    for(let x=Math.min(...xs);x<=Math.max(...xs);x+=.5)for(let y=Math.min(...ys);y<=Math.max(...ys);y+=.5){const P=[x,y];if(inside(P))hTop=Math.max(hTop,hAt(P));}
    hTop+=.75;
    G.forEach((g,k)=>{
      const us=proj(g,'u'), umax=Math.min(Math.max(...us),hTop), ss=proj(g,'s'), s0=Math.min(...ss), s1=Math.max(...ss);
      const mine=(s,u)=>owner(toP(g,s,u))===k;
      function line(s){
        const out=[],du=1/4; let inA=null, prev=1e-6, pin=mine(s,prev); if(pin)inA=prev;
        const edge=(lo,hi,want)=>{for(let i=0;i<22;i++){const m=(lo+hi)/2; if(mine(s,m)===want)hi=m; else lo=m;}return hi;};
        for(let u=du;u<umax+du;u+=du){const uu=Math.min(u,umax-1e-6),cur=mine(s,uu);
          if(cur!==pin){const x=edge(prev,uu,cur); if(cur)inA=x; else {out.push([inA,x]);inA=null;} pin=cur;}
          prev=uu; if(uu>=umax-1e-6)break;}
        if(inA!=null) out.push([inA,prev]);
        return out.filter(([a,b])=>b-a>1e-4);
      }
      // find where this plane starts and ends across the eave direction
      const has=s=>line(s).length>0;
      let a0=null,a1=null; const ok=[];
      const C=cov/3; for(let s=s0+1e-6;s<s1;s+=C){ if(has(s)){ if(a0==null)a0=s; a1=s; } }
      if(a0==null) return;
      const refine=(out,inn)=>{for(let i=0;i<24;i++){const m=(out+inn)/2; if(has(m))inn=m; else out=m;}return inn;};
      { const o=Math.max(s0+1e-6,a0-C); a0=has(o)?o:refine(o,a0); }
      { const o=Math.min(s1-1e-6,a1+C); a1=has(o)?o:refine(o,a1); }
      // fine scan aligned to panel edges, then join intervals into connected pieces
      const comps=[]; let last=[];
      const n=Math.max(1,Math.ceil((a1-a0)/H-1e-9));
      for(let j=0;j<=n;j++){ const s=j===n?a1:a0+j*H, ivs=line(s), now=[];
        for(const [a,b] of ivs){ const pc=last.find(q=>q.a<b+1.5*H&&a<q.b+1.5*H);
          let c=pc?pc.c:null; if(!c){c={rows:[]};comps.push(c);}
          const r=c.rows[c.rows.length-1]; if(r&&r.j===j){r.a=Math.min(r.a,a);r.b=Math.max(r.b,b);} else c.rows.push({j,s,a,b});
          now.push({a,b,c}); }
        last=now; }
      for(const c of comps){ if(c.rows.length<2) continue;
        const face={sec:si,pf,g,rows:c.rows,dir:g.ax===0?(g.n>0?'north':'south'):(g.n>0?'west':'east'),panels:[],toP:(s,u)=>toP(g,s,u)};
        const rows=c.rows, j0=rows[0].j, sA=rows[0].s, sB=rows[rows.length-1].s;
        // corners that fall between scan lines: extend the two neighbouring slopes to where they meet

          if(!R2.length) continue;
          let umin=Math.min(...R2.map(r=>r.a)), umax2=Math.max(...R2.map(r=>r.b));
          for(const t of tops) if(t.s>lo&&t.s<hi) umax2=Math.max(umax2,t.v);
          for(const t of bots) if(t.s>lo&&t.s<hi) umin=Math.min(umin,t.v);
          const eaveEnd=umin<.01, len=(umax2-umin)*pf+(eaveEnd?over:0), inch=Math.ceil(len*12-1e-6);
          const poly=[...R2.map(r=>toP(g,r.s,r.a)),...R2.slice().reverse().map(r=>toP(g,r.s,r.b))];
          face.panels.push({lo,hi,umin,umax:umax2,inch,rip:hi-lo<cov-1e-3?Math.round((hi-lo)*12*4)/4:0,poly,eave:eaveEnd});
        }
        face.sliver=(sB-sA)%cov>1e-4&&(sB-sA)%cov<=.125?Math.round(((sB-sA)%cov)*48)/4:0;
        // area and the lines between faces (each shared line is counted from both sides, so halve later)
        let fa=0; face.lines={ridge:0,hip:0,valley:0};
        const onOutline=P=>edges.some(e=>{const ax=e.ax,o=1-ax,lo2=Math.min(e.a[ax],e.b[ax]),hi2=Math.max(e.a[ax],e.b[ax]);return Math.abs(P[o]-e.a[o])<.02&&P[ax]>lo2-.02&&P[ax]<hi2+.02;});

}

// ---------- siding engine: walls -> courses -> plank pieces ----------
// Inches throughout. Each wall is a rectangle with an optional gable on top; openings are placed
// by their distance from the wall's left edge and from the bottom of the siding.
function buildSiding(walls,expIn,plankIn){
  const S={walls:[],gross:0,open:0,net:0,pieces:[],planks:0,starter:0,openTrim:0,err:[]};
  const q=x=>Math.round(x*4)/4;                                   // cut to the 1/4"
  (walls||[]).forEach((w,wi)=>{
    const W=(+w.w||0)*12, H=(+w.h||0)*12, P=(+w.peak||0)*12, T=H+P;
    const name=w.name||('Wall '+(wi+1)), out={name,W,H,P,courses:[],open:[],ok:false,msg:''};
    S.walls.push(out);
    if(!(W>0&&H>0)){out.msg='Enter the wall width and height.';return;}
    const ops=(w.open||[]).map((o,oi)=>{const x0=(+o.x||0)*12,y0=o.t==='door'?0:(+o.y||0)*12;
      return {t:o.t==='door'?'door':'window',x0,x1:x0+(+o.w||0)*12,y0,y1:y0+(+o.h||0)*12,code:(o.t==='door'?'D':'W')+(oi+1)};}).filter(o=>o.x1>o.x0&&o.y1>o.y0);
    for(const o of ops){ if(o.x0<0||o.x1>W+.01||o.y1>T+.01) out.msg='An opening sits past the edge of '+name+'. Check its position.'; }
    out.open=ops;
    const gross=W*H+W*P/2, oa=ops.reduce((a,o)=>a+(Math.min(o.x1,W)-Math.max(o.x0,0))*(o.y1-o.y0),0);
    S.gross+=gross/144; S.open+=oa/144; S.starter+=W;
    for(const o of ops) S.openTrim+=o.t==='door'?(o.x1-o.x0)+2*(o.y1-o.y0):2*(o.x1-o.x0)+2*(o.y1-o.y0);
    const n=Math.ceil(T/expIn-1e-6);
    for(let i=0;i<n;i++){
      const y0=i*expIn, y1=Math.min(T,(i+1)*expIn);
      // width of the wall at the bottom of this course (the long point for gable courses)
      let a=0,b=W,angled=false;
      if(y0>=H-1e-6){ if(!(P>0)) break; const g=W*(1-(y0-H)/P); a=(W-g)/2; b=(W+g)/2; angled=true; }
      else if(y1>H+1e-6&&P>0) angled=true;
      if(b-a<1) continue;
      const gaps=[], notch=[];
      for(const o of ops){ if(o.y0<y1-1e-6&&o.y1>y0+1e-6){ (o.y0<=y0+.5&&o.y1>=y1-.5?gaps:notch).push(o); } }
      gaps.sort((p,r)=>p.x0-r.x0);
      const segs=[]; let x=a;
      for(const o of gaps){ const g0=Math.max(a,o.x0), g1=Math.min(b,o.x1); if(g1<=x) continue; if(g0>x) segs.push([x,g0]); x=Math.max(x,g1); }
      if(x<b) segs.push([x,b]);
      const course={i:i+1,y0,y1,pieces:[],rip:y1-y0<expIn-.01&&!angled?q(y1-y0):0};   // top course ripped to fit under the soffit
      for(const [s0,s1] of segs){
        if(s1-s0<.5) continue;
        // stagger joints: every other course starts with a half plank, unless that leaves a sliver at the end
        const L=s1-s0, plan=stag=>{const out=[];let r=L;if(stag&&r>plankIn){out.push(plankIn/2);r-=plankIn/2;}while(r>.01){const l=Math.min(plankIn,r);out.push(l);r-=l;}return out;};
        let lens=plan(i%2===1); if(lens.length>1&&lens[lens.length-1]<24) lens=plan(false);
        if(lens.length>1&&lens[lens.length-1]<24){const k=lens.length-1,d=24-lens[k];lens[k-1]-=d;lens[k]=24;}   // no piece shorter than 2 ft
        let cut=s0;
        for(const len of lens){
          const x0=cut,x1=cut+len, nt=notch.filter(o=>o.x0<x1&&o.x1>x0).map(o=>o.code);
          const p={wall:wi,course:i+1,x0,x1,len:q(len),full:Math.abs(len-plankIn)<.01,
            ends:angled&&((Math.abs(x0-a)<.01)||(Math.abs(x1-b)<.01))?'angle':'',notch:nt};
          course.pieces.push(p); S.pieces.push(p); cut=x1;
        }
      }
      if(course.pieces.length) out.courses.push(course);
    }
    out.ok=!out.msg;
  });

  const cuts=S.pieces.filter(p=>!p.full).map(p=>p.len).sort((a,b)=>b-a), bins=[];

  S.planks=S.pieces.filter(p=>p.full).length+bins.length;
  return S;
}

    let g, R=null;
    if(st.method==='report'){
      const q=st.rep; g={area:+q.area||0,pitch:+q.pitch||0,eave:+q.eave||0,rake:+q.rake||0,ridge:+q.ridge||0,hips:+q.hip||0,valleys:+q.valley||0,wall:+q.flash||0};
      if(!(g.area>0)) return {err:'Enter the total roof area from the report, or import the report.'};
    } else {
      if(st.method==='simple'&&!(st.L>0&&st.W>0)) return {err:'Enter the roof length and width.'};
      const secs=st.method==='simple'?simpleSecs():st.sections, key=JSON.stringify([secs,covFt,over]);
      if(key!==roofKey){roofKey=key;roofR=buildRoof(secs,covFt,over);} R=roofR;
      const bad=R.secs.find(x=>!x.ok);
      if(bad) return {err:bad.name+': '+bad.msg+' Fix it on the measurements screen.'};
      if(!R.faces.length) return {err:'Enter the roof outline.'};
      g={area:R.area,pitch:R.pitch,eave:R.eave,rake:R.rake,ridge:R.ridge,hips:R.hips,valleys:R.valleys,wall:R.wall};
    }
    const w=1+(+st.waste||0)/100, sqW=g.area*w/100, rows=[];
    const lowShingle=!metal&&g.pitch>=2&&g.pitch<4;
    const under=['Underlayment',Math.ceil(g.area*1.1*(lowShingle?2:1)/100/Math.max(.1,+C.under||10))+' rolls',(ss?'High-temp synthetic. ':'')+(lowShingle?'2 layers for low slope. ':'')+f(C.under)+' squares per roll'];
    const iceLF=g.eave*Math.max(0,Math.round(+C.iceRows||0))+g.valleys;
    const ice=['Ice and water shield',Math.ceil(iceLF/Math.max(1,+C.ice||66))+' rolls',f(iceLF)+' ft at eaves and valleys'];
    let cost=null, cut=null;
    if(!metal){
      const nails=Math.ceil(sqW*67)*(+st.nails||4), box=Math.max(1,+C.nailsBox||7200);
      rows.push(['Shingles',Math.ceil(sqW*3)+' bundles','3 bundles per square, waste included'],
        ['Starter strip',Math.ceil((g.eave+g.rake)/Math.max(1,+C.start||110))+' bundles',f(g.eave+g.rake)+' ft of eaves and rakes'],
        ['Ridge cap',Math.ceil((g.ridge+g.hips)/Math.max(1,+C.ridge||25))+' bundles',f(g.ridge+g.hips)+' ft of ridges and hips'],
        ['Drip edge',Math.ceil((g.eave+g.rake)*1.05/10)+' pcs','10 ft pieces'],
        ['Headwall flashing',g.wall?Math.ceil(g.wall*1.05/10)+' pcs':null,f(g.wall)+' ft'],
        under,ice,['Coil nails',Math.max(1,Math.ceil(nails/box))+' box'+(nails>box?'es':''),'about '+f(nails)+' nails']);
    } else {
      const trimLen=Math.max(1,+C.trim||10); let trimPcs=0;
      const pcs=(k,lf,what)=>{if(!(lf>0))return [k,null];const n=Math.ceil(lf*1.05/trimLen);trimPcs+=n;return [k,n+' pcs',f(lf)+' ft'+(what?', '+what:'')];};
      let panels, totalLF, clips=0, screwBags=0;
      if(R){panels=R.panels;totalLF=R.lf;clips=ss?R.clips:0;cut=engineItems(R);}
      else {totalLF=g.area*w/covFt;clips=ss?Math.ceil(totalLF/2)+Math.ceil(g.eave/covFt):0;}
      const name=PANELS.find(p=>p[0]===st.panel)[1];
      rows.push(R?['Panels',panels+' pcs',name+', '+f(totalLF)+' ft, cut to length (see cut list)']:['Panels',f(Math.ceil(totalLF/10)*10)+' ft',name+', waste included']);
      rows.push(pcs('Eave trim',g.eave),pcs('Rake trim',g.rake),pcs('Ridge cap',g.ridge),pcs('Hip cap',g.hips),pcs('Valley flashing',g.valleys),pcs('Headwall flashing',g.wall));
      if(ss){
        rows.push(pcs('Z-closure',2*g.ridge+2*g.hips),['Panel clips','about '+f(clips),'24" apart'],['Pancake screws','about '+f(clips),'1 per clip']);
      } else {
        const screws=Math.ceil(sqW*(+C.screws||80)); screwBags=Math.ceil(screws/250);
        rows.push(['Inside closures',Math.ceil(g.eave/covFt)+' pcs','at the eaves'],
          ['Outside closures',(g.ridge+g.hips)?Math.ceil(2*(g.ridge+g.hips)/covFt)+' pcs':null,'at ridges and hips'],
          ['Panel screws',screwBags+' bags','about '+f(screws)+', 250 per bag']);
      }
      rows.push(under,ice);
      for(const r of rows) if(r[0].includes('trim')||r[0].includes('cap')||r[0].includes('flashing')||r[0]==='Z-closure') if(r[1]) r[2]+=', '+f(trimLen)+' ft pieces';
      const P=st.price, cP=totalLF*(+P.panel||0), cT=trimPcs*trimLen*(+P.trim||0), cS=screwBags*(+P.screw||0);
      if(cP+cT+cS>0) cost={total:cP+cT+cS,ss,lines:[['Panels',cP],['Trim',cT],['Screws',cS]].filter(x=>x[1]>0)};
    }
    return {area:g.area,sqW,warn:slopeWarn(g.pitch,ss),rows:rows.filter(r=>r&&r[1]!=null),cut,R,cost,metal};
  }
  const money=x=>'$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  const SVGNS='http://www.w3.org/2000/svg';
  function sv(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e;}
  const pts=P=>P.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  function viewer(host,svg,startZoom,maxZoom){
    let z=1; const zb=el('div','zoom'), vw=el('div','viewer');
    const zo=el('button','btn-sm','−'), zi=el('button','btn-sm','+'), zf=el('button','btn-sm','Fit'), zl=el('span');
    zo.setAttribute('aria-label','Zoom out'); zi.setAttribute('aria-label','Zoom in'); zb.append(zo,zi,zf,zl); vw.append(svg); host.append(zb,vw);
    const set=nz=>{const r=vw.getBoundingClientRect(),cx=(vw.scrollLeft+r.width/2)/z,cy=(vw.scrollTop+r.height/2)/z;z=Math.min(maxZoom,Math.max(1,nz));svg.style.setProperty('--z',z);vw.scrollLeft=cx*z-r.width/2;vw.scrollTop=cy*z-r.height/2;zl.textContent=z===1?'Zoom in to read the labels':Math.round(z*100)+'%';};
    zi.onclick=()=>set(z*1.6); zo.onclick=()=>set(z/1.6); zf.onclick=()=>set(1);

  function drawRoof(host,R,metal){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const s of R.secs) if(s.ok) for(const [x,y] of s.V){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
    const m=2, svg=sv('svg',{viewBox:(x0-m)+' '+(y0-m)+' '+(x1-x0+2*m)+' '+(y1-y0+2*m),role:'img','aria-label':metal?'Roof plan with every panel and its cut length':'Roof plan'});
    const mk=sv('marker',{id:'arr',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto'},sv('defs',{},svg));
    sv('path',{d:'M0 0L10 5L0 10z',fill:'var(--good)'},mk);
    for(const fc of R.faces){
      const outline=[...fc.rows.map(r=>fc.toP(r.s,r.a)),...fc.rows.slice().reverse().map(r=>fc.toP(r.s,r.b))];
      if(metal) fc.panels.forEach((p,i)=>sv('polygon',{points:pts(p.poly),fill:i%2?'var(--pa)':'var(--pb)',stroke:'var(--seam)','stroke-width':.06},svg));
      else sv('polygon',{points:pts(outline),fill:'var(--pa)'},svg);
      sv('polygon',{points:pts(outline),fill:'none',stroke:'var(--ridgec)','stroke-width':.14,'stroke-linejoin':'round'},svg);
    }
    for(const s of R.secs) if(s.ok) for(const e of s.edges){
      const c=e.t==='rake'?{stroke:'var(--good)','stroke-dasharray':'.7 .4'}:e.t==='wall'?{stroke:'var(--amber)'}:{stroke:'var(--fg)'};
      sv('line',Object.assign({x1:e.a[0],y1:e.a[1],x2:e.b[0],y2:e.b[1],'stroke-width':.24,'stroke-linecap':'round'},c),svg);
    }
    for(const fc of R.faces){
      if(metal){
        for(const p of fc.panels){
          const mid=(p.lo+p.hi)/2, row=fc.rows.reduce((a,r)=>Math.abs(r.s-mid)<Math.abs(a.s-mid)?r:a), span=row.b-row.a;
          const label=p.code+' '+ftIn(p.inch), fs=Math.max(.2,Math.min(.95,(p.hi-p.lo)*.42,span/(label.length*.5)));
          const [x,y]=fc.toP(mid,(row.a+row.b)/2), t=sv('text',{x:x.toFixed(2),y:y.toFixed(2),'font-size':fs.toFixed(2),'text-anchor':'middle','dominant-baseline':'central'},svg);
          if(fc.g.ax===0) t.setAttribute('transform','rotate(-90 '+x.toFixed(2)+' '+y.toFixed(2)+')');
          t.textContent=label;
        }
        if(fc.panels.length){const p=fc.panels[0],u=p.umin+.45,a=fc.toP(p.lo+.15,u),b=fc.toP(p.lo+1.9,u);
          sv('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--good)','stroke-width':.2,'marker-end':'url(#arr)'},svg);}
      } else {
        const r=fc.rows.reduce((a,q)=>q.b-q.a>a.b-a.a?q:a),[x,y]=fc.toP(r.s,(r.a+r.b)/2);
        sv('text',{x,y,'font-size':1.4,'text-anchor':'middle','dominant-baseline':'central'},svg).textContent=fc.code;
      }
    }
    const cx=x1+m*.55, cy=y1+m*.2; sv('line',{x1:cx,y1:cy,x2:cx,y2:cy-1.6,stroke:'var(--fg)','stroke-width':.14},svg);
    sv('text',{x:cx,y:cy-2.2,'font-size':1,'text-anchor':'middle'},svg).textContent='N';
    host.append(el('p','hint',metal?'Each strip is one panel with its code and cut length. Panel 1 on each face starts at the green arrow.':'Roof faces, north up.'));
    viewer(host,svg,metal?2.2:1,5);
    const key=el('div','key');
    for(const [c,t] of [['var(--ridgec)','Ridge, hip, valley'],['var(--fg)','Eave'],['var(--good)','Rake'],['var(--amber)','Wall']]){const s=el('span'),i=el('i');i.style.background=c;s.append(i,t);key.append(s);}
    host.append(key);
  }
  function drawWall(host,w,exp){
    const {W,H,P}=w, T=H+P, padL=16, pad=6, Y=y=>T-y;
    const svg=sv('svg',{viewBox:(-padL)+' '+(-pad)+' '+(W+padL+pad)+' '+(T+2*pad),role:'img','aria-label':w.name+' with every course and plank'});
    const id='clip'+Math.random().toString(36).slice(2,8), shape=[[0,Y(0)],[W,Y(0)],[W,Y(H)]].concat(P>0?[[W/2,Y(T)]]:[]).concat([[0,Y(H)]]);
    sv('polygon',{points:pts(shape)},sv('clipPath',{id},sv('defs',{},svg)));
    const g=sv('g',{'clip-path':'url(#'+id+')'},svg), fs=Math.max(2,exp*.5);
    for(const c of w.courses){
      c.pieces.forEach((p,k)=>sv('rect',{x:p.x0,y:Y(c.y1),width:p.x1-p.x0,height:c.y1-c.y0,fill:(k+c.i)%2?'var(--pa)':'var(--pb)',stroke:'var(--seam)','stroke-width':.4},g));

      sv('text',{x:(p.x0+p.x1)/2,y:Y((c.y0+c.y1)/2),'font-size':fs,'text-anchor':'middle','dominant-baseline':'central'},svg).textContent=label;
    }
    for(const o of w.open){
      sv('rect',{x:o.x0,y:Y(o.y1),width:o.x1-o.x0,height:o.y1-o.y0,fill:'var(--hole)',stroke:'var(--fg)','stroke-width':.8},svg);
      sv('text',{x:(o.x0+o.x1)/2,y:Y((o.y0+o.y1)/2),'font-size':Math.min(10,(o.x1-o.x0)/4),'text-anchor':'middle','dominant-baseline':'central'},svg).textContent=o.code;
    }
    sv('polygon',{points:pts(shape),fill:'none',stroke:'var(--fg)','stroke-width':1.2,'stroke-linejoin':'round'},svg);
    viewer(host,svg,2.6,6);
  }

  function sideCalc(){
    const S=buildSiding(st.walls,+st.exp,144);
    if(!(S.gross>0)) return {err:'Enter at least one wall width and height.'};
    const extra=+st.extra||0, buy=Math.ceil(S.planks*(1+extra/100)), maxH=Math.max(...st.walls.map(w=>+w.h||0));
    const runs=Math.max(1,Math.ceil(maxH/12)), outB=Math.round(+st.corners.out||0)*2*runs, inB=Math.round(+st.corners.inn||0)*runs, trimB=Math.ceil(S.openTrim*1.1/144);
    const nails=Math.ceil((buy*9+(outB+inB+trimB)*12)/100)*100;
    const plank=PLANKS.find(p=>+p[0]===+st.exp)[1];
    const rows=[['HardiePlank, 12 ft',buy+' pcs',plank+'. '+S.planks+' from the cut list plus '+f(extra)+'% for breakage.'],
      ['Starter strip',Math.ceil(S.starter/144)+' pcs',f(S.starter/12)+' ft along the bottom, 12 ft pieces'],
      ['Outside corner boards',outB?outB+' pcs':null,f(st.corners.out)+' corners, 2 boards each, 12 ft'],
      ['Inside corner boards',inB?inB+' pcs':null,f(st.corners.inn)+' corners, 1 board each, 12 ft'],
      ['Window and door trim',trimB?trimB+' pcs':null,f(S.openTrim/12)+' ft around openings, 12 ft boards'],
      ['Siding nails','about '+f(nails),'blind nailed at every stud, plus trim'],
      ['House wrap',(x=>x+' roll'+(x>1?'s':''))(Math.ceil(S.gross*1.15/1350)),'9 ft × 150 ft rolls']];
    const m=new Map(); for(const p of S.pieces) m.set(p.len,(m.get(p.len)||0)+1);
    return {S,rows,byLen:[...m].sort((a,b)=>b[0]-a[0]),warn:S.walls.filter(w=>w.msg).map(w=>w.name+': '+w.msg).join(' ')};
  }
  function sideResView(app){
    topbar(app,'Siding results','siding','Edit');
    const v=el('div','view'), res=el('div','view'); res.id='res';
    const more=el('details','more'), inner=el('div','inner');
    inner.append(num('Extra planks for breakage',()=>st.extra,x=>st.extra=x,'%',()=>later(fillSide)));
    more.append(el('summary',null,'Extra for breakage'),inner);
    v.append(res,more); app.append(v); fillSide();
    bar('Copy list',()=>copy(sideText()));
  }
  function fillSide(){
    const res=$('res'); if(!res) return; res.innerHTML='';
    const r=sideCalc();
    if(r.err){res.append(card(null,el('p','callout',r.err)));return;}
    const S=r.S;
    if(r.warn) res.append(el('p','callout',r.warn));
    const big=el('p','big',f(S.net)); big.append(el('small',null,'sq ft'));
    res.append(card('Square feet',big,el('p','hint','Walls '+f(S.gross)+' sq ft, minus '+f(S.open)+' sq ft of windows and doors.')));
    res.append(card('Material list',list(r.rows)));
    const cl=card('Cut list',el('p','hint','Every plank length and how many to cut. 12’0" pieces are full planks.'));
    let n=0; const rows=[]; for(const [len,c] of r.byLen){rows.push([ftIn4(len),c+' pc'+(c>1?'s':''),null,'len']);n+=c;}
    rows.push(['Total',n+' pieces from '+S.planks+' planks',null,'tot']); cl.append(list(rows));
    for(const w of S.walls){ if(!w.courses.length) continue;
      const d=el('details','sub2'); d.append(el('summary',null,'Show '+w.name+', course by course'));
      const cs=el('div','courses');
      for(const c of w.courses){const row=el('div');row.append(el('i',null,'#'+c.i),el('span',null,c.pieces.map(p=>ftIn4(p.len)+(p.ends?' ∠':'')+(p.notch.length?' notch '+p.notch.join(','):'')).join('  ·  ')+(c.rip?'  (rip to '+c.rip+'")':'')));cs.append(row);}
      d.append(el('p','hint','Course 1 is at the bottom. ∠ = angle cut for the gable. Notch = cut around that window or door.'),cs); cl.append(d);
    }
    res.append(cl);
    const lc=card('Layout');
    for(const w of S.walls){ if(!w.courses.length) continue; lc.append(el('p','fh',w.name)); drawWall(lc,w,+st.exp); }
    res.append(lc);
  }

  // ---------- copy ----------
  async function copy(text){
    try{await navigator.clipboard.writeText(text);toast('List copied');}
    catch(e){let t=document.querySelector('.copyout');if(!t){t=el('textarea','inp copyout');t.readOnly=true;$('res').prepend(t);}t.value=text;t.focus();t.select();window.scrollTo(0,0);toast('Select and copy the list');}
  }
  const rowsText=rows=>rows.map(([k,v,n])=>k+': '+v+(n?' ('+n+')':''));
  function roofText(){
    const r=roofCalc(); if(r.err) return r.err;
    const L=[(r.metal?'METAL':'SHINGLE')+' ROOF ORDER','','SQUARE FEET: '+f(r.area)+' sq ft ('+f(r.area/100,1)+' squares, '+f(r.sqW,1)+' with '+f(st.waste)+'% waste)','','MATERIAL LIST',...rowsText(r.rows)];
    if(r.cost) L.push('Estimated material cost: '+money(r.cost.total));
    if(r.cut){L.push('','PANEL CUT LIST');for(const [inch,c] of r.cut.byLen)L.push(c+' @ '+ftIn(+inch));
      L.push('','EVERY PIECE, BY ROOF FACE');for(const fc of r.cut.faces)L.push(fc.code+' ('+(fc.name?fc.name+', ':'')+'faces '+fc.dir+'): '+fc.pieces.map(p=>p.code+' '+ftIn(p.inch)+(p.rip?' rip '+p.rip+'"':'')).join(', '));}
    return L.join('\n');
  }
  function sideText(){
    const r=sideCalc(); if(r.err) return r.err; const S=r.S;
    const L=['HARDIE SIDING ORDER','','SQUARE FEET: '+f(S.net)+' sq ft (walls '+f(S.gross)+', minus '+f(S.open)+' openings)','','MATERIAL LIST',...rowsText(r.rows.filter(x=>x[1]!=null)),'','CUT LIST'];
    for(const [len,c] of r.byLen) L.push(c+' @ '+ftIn4(len));
    for(const w of S.walls){ if(!w.courses.length) continue; L.push('',w.name.toUpperCase()+', COURSE BY COURSE (1 = bottom)');
      for(const c of w.courses) L.push('#'+c.i+': '+c.pieces.map(p=>ftIn4(p.len)+(p.ends?' angle':'')+(p.notch.length?' notch '+p.notch.join(','):'')).join(', ')+(c.rip?' (rip to '+c.rip+'")':'')); }
    return L.join('\n');
  }

  const VIEWS={home:homeView,roof:roofView,roofRes:roofResView,siding:sidingView,sideRes:sideResView};

  function slopeWarn(p,ss){
    if(st.mat==='shingle'){
      if(p<2) return 'Shingles aren\u2019t rated below 2/12. Use metal or a low-slope membrane roof.';
      if(p<4) return 'Between 2/12 and 4/12 shingles need two layers of underlayment (or ice and water shield over the whole deck). Underlayment below is doubled.';
      return '';
    }
    if(p<3) return ss
      ? 'Below 3/12 many snap-lock standing seam panels aren\u2019t rated. Check the panel\u2019s minimum slope; low slopes usually need a mechanically seamed panel.'
      : 'Exposed-fastener panels generally need at least 3/12. Check the panel\u2019s minimum slope, or use standing seam.';
    return '';
  }


  // ---------- import from HOVER / EagleView ----------
  const PDF_LIB='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let sample=null, caps=null, ctl=null;
  function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));const t=setTimeout(()=>rej(new Error('timeout')),20000);s.addEventListener('load',()=>clearTimeout(t));document.head.append(s);});}
  async function pdfjs(){
    if(window.pdfjsLib) return window.pdfjsLib;
    await loadScript(PDF_WORKER);           // runs the parser on the page (no separate worker needed)
    await loadScript(PDF_LIB);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER;
    return window.pdfjsLib;
  }
  async function readPdf(file,maxImgs){
    const lib=await pdfjs();
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
    let text='';
    const pages=Math.min(doc.numPages,40);
    for(let i=1;i<=pages;i++){
      const pg=await doc.getPage(i); const tc=await pg.getTextContent();
      text+='\n--- Page '+i+' ---\n'+tc.items.map(t=>t.str+(t.hasEOL?'\n':' ')).join('');
      if(text.length>120000) break;
    }
    if(text.replace(/\s|---|Page \d+/g,'').length>400) return {text,images:[]};
    // scanned PDF: render the first pages as pictures instead
    const imgs=[];
    for(let i=1;i<=Math.min(doc.numPages,maxImgs);i++){
      const pg=await doc.getPage(i); const v1=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:1400/v1.width});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));
    }
    return {text:'',images:imgs};
  }
  const PROMPT=`You are reading a roofing and/or siding measurement report from HOVER or EagleView (a contractor's takeoff report). The report text and/or images are provided.
Extract the measurements and reply with ONLY one JSON object in exactly this shape (numbers only, no units, null when the report does not give it):
{"source":"HOVER"|"EagleView"|"other","roof":{"total_area_sqft":n,"pitch":n,"eaves_ft":n,"rakes_ft":n,"ridges_ft":n,"hips_ft":n,"valleys_ft":n,"flashing_ft":n,"suggested_waste_pct":n},"siding":{"siding_area_sqft":n,"outside_corners_ft":n,"inside_corners_ft":n,"opening_trim_ft":n},"notes":"one short sentence about anything unusual"}
Rules:
- Convert feet-and-inches like 45' 6" to decimal feet (45.5). Convert squares to square feet if needed (1 square = 100 sq ft).
- roof.total_area_sqft is the total roof area WITHOUT waste. pitch is the predominant pitch as the rise over 12 (6 for 6/12).
- rakes are also called gables or rake edges. eaves are also called starter or drip edge at eaves.
- If a waste table is shown, suggested_waste_pct is the report's suggested waste percent.
- flashing_ft is the report's Flashing total (headwall/apron flashing), not step flashing.
- siding.siding_area_sqft is the total wall area to be sided (facades plus gables) with openings removed; if only a gross area and an openings area are given, subtract them. opening_trim_ft is the total perimeter of windows and doors if given.
- Set the whole "roof" or "siding" object's fields to null if that part is not in the report. Do not guess numbers that are not in the report.`;

  function setSt(msg,cls){const s=$('impSt');s.className='st'+(cls?' '+cls:'');s.textContent=msg;}
  function errMsg(code){
    switch(code){
      case 'not_granted': return 'Import needs your OK to use Claude. Reload the page and allow it when it asks.';
      case 'rate_limited': return 'Too many requests right now. Try again in a minute.';
      case 'invalid_json': case 'empty_completion': case 'refused': return 'Couldn\u2019t find measurements in that. Try the full PDF, or a clear screenshot of the measurement summary page.';
      case 'image_rejected': return 'That picture couldn\u2019t be read. Use a PNG or JPEG screenshot.';
      case 'images_unavailable': return 'Pictures aren\u2019t supported here. Use the PDF report instead.';
      case 'prompt_too_large': return 'That report is too big to read in one go. Try just the summary pages.';
      case 'session_expired': return 'Your session expired. Reload the page and try again.';
      case 'pdf': return 'Couldn\u2019t open that PDF here. Screenshot the measurement summary page and import that instead.';
      case 'no_sample': return 'Import isn\u2019t available in this view. Open the page from your Claude account in Chrome, not from a saved copy.';
      default: return 'Something went wrong reading the report. Try again.';
    }
  }
  function errFull(e){const code=(e&&e.code)||'unknown';const m=e&&e.message?' '+String(e.message).slice(0,120):'';return errMsg(code)+' (Error: '+code+(code==='unknown'||code==='upstream_error'?m:'')+')';}
  let importReady=false;
  function put(o,k,v){ if(v==null||!isFinite(+v)||+v<=0){o[k]='';return false;} o[k]=Math.round(+v*10)/10; return true; }
  function apply(d){
    const done=[], r=d&&d.roof||{}, q=st.rep;
    const anyRoof=['total_area_sqft','eaves_ft','rakes_ft','ridges_ft','hips_ft','valleys_ft'].some(k=>+r[k]>0);
    if(!anyRoof) throw {code:'invalid_json'};
    if(put(q,'area',r.total_area_sqft)) done.push('Roof area '+f(r.total_area_sqft)+' ft²'); else done.push('No total roof area on that page. Type it in from the report summary.');
    if(r.pitch>0){ q.pitch=nearPitch(+r.pitch); done.push('pitch '+q.pitch+'/12'); }
    const got=[]; for(const [k,rk,label] of [['eave','eaves_ft','eaves'],['rake','rakes_ft','rakes'],['ridge','ridges_ft','ridges'],['hip','hips_ft','hips'],['valley','valleys_ft','valleys'],['flash','flashing_ft','flashing']]) if(put(q,k,r[rk])) got.push(label+' '+f(r[rk]));
    if(got.length) done.push(got.join(', ')+' ft');
    if(r.suggested_waste_pct>0&&r.suggested_waste_pct<40){st.waste=+r.suggested_waste_pct;st.wasteEdited=true;done.push('waste '+st.waste+'% (from the report)');} else autoWaste();
    st.method='report'; st.view='roof'; render();
    const s2=$('impSt'); s2.className='st ok'; s2.textContent='Filled in from '+(d.source&&d.source!=='other'?d.source:'the report')+'. Check these against the report:';
    const ul=el('ul'); for(const x of done) ul.append(el('li',null,x)); if(d.notes) ul.append(el('li',null,String(d.notes).slice(0,200))); s2.append(ul);
  }
  async function runImport(files){
    if(!files.length) return;
    if(!sample){ setSt(errMsg('no_sample'),'err'); return; }
    setSt('Got '+files.map(x=>x.name||'file').join(', ')+'. Working on it…');
    ctl=new AbortController(); $('impStop').classList.remove('hide'); $('impBtn').classList.add('off');
    try{
      const maxImgs=caps&&caps.images?caps.images.maxCount:0;
      let text='', images=[];
      for(const file of files){
        if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
          setSt('Opening '+file.name+'…');
          let r; try{ r=await readPdf(file,Math.max(0,maxImgs-images.length)); }catch(e){ throw {code:'pdf'}; }
          text+=r.text; images=images.concat(r.images);
        } else if(/^image\//.test(file.type)) images.push(file);
      }
      if(!text&&!images.length){ setSt('Pick a PDF report or a screenshot (PNG or JPEG).','err'); return; }
      if(images.length&&!maxImgs) throw {code:'images_unavailable'};
      images=images.slice(0,maxImgs);
      setSt('Reading the measurements… this can take up to a minute.');
      const input=PROMPT+(text?'\n\nREPORT TEXT:\n'+text.slice(0,120000):'\n\nThe report is in the attached image'+(images.length>1?'s':'')+'.');
      const opts={signal:ctl.signal}; if(images.length) opts.images=images;
      apply(await sample.json(input,opts));
    }catch(e){
      if(e&&e.code==='cancelled') setSt('Stopped.'); else setSt(errFull(e),'err');
    }finally{
      $('impStop').classList.add('hide'); $('impBtn').classList.remove('off'); $('impFile').value='';
    }
  }
  $('impFile').onchange=()=>runImport([...$('impFile').files]);
  $('impStop').onclick=()=>{ if(ctl) ctl.abort(); };
  async function initImport(){
    try{
      if(!window.claude||typeof window.claude.use!=='function') return;
      sample=await window.claude.use('sample');
      if(!sample){ setSt(errMsg('no_sample'),'err'); return; }
      importReady=true;
      caps=await sample.limits().catch(()=>null);
      if(caps&&caps.images){ $('impFile').accept='application/pdf,.pdf,'+caps.images.mediaTypes.join(','); setSt(''); }
      else { $('impFile').accept='application/pdf,.pdf'; $('impBtn').textContent='Choose the PDF report'; setSt('Screenshots aren’t supported here, but the PDF works.'); }
      if(st.view==='roof'&&st.method==='report') render();
    }catch(e){ setSt(errFull(e),'err'); }
  }
  window.addEventListener('pagehide',save);
  load(); render(); initImport();
})();
