<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090C10">
<title>Job calculator V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Header with the Roof/Siding switch and live totals; one tab of content; a floating tab bar.
   Every tab leads with its answer, details follow. */
:root{
  color-scheme:dark;
  --bg:#090C10; --glow:rgba(120,190,245,.10);
  --surface:#11161C; --surface2:#171E26; --raised:#1D2530; --sheen:rgba(255,255,255,.028);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --fg:#EEF2F6; --muted:#8C98A5; --faint:#5F6B78;
  --accent:#78BEF5; --accent-ink:#061420; --accent-soft:rgba(120,190,245,.14);
  --amber:#F2B24C; --teal:#4FCFB9; --good:#5FD39A; --warn:#FF8A75; --warn-soft:rgba(255,138,117,.12);
  --pa:#1F3349; --pb:#29425F; --seam:#4F6E93; --ridgec:#FF8A75; --hole:#090C10;
  --thumbc:#2B3644; --glass:rgba(17,22,28,.78); --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --f-display:Archivo,"Arial Narrow",sans-serif;
  --f-body:Figtree,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#F2F4F7; --glow:rgba(23,103,174,.07);
    --surface:#FFFFFF; --surface2:#F8FAFC; --raised:#EFF3F7; --sheen:rgba(255,255,255,0);
    --line:rgba(15,23,32,.08); --line2:rgba(15,23,32,.14);
    --fg:#0E141B; --muted:#5B6875; --faint:#8D99A6;
    --accent:#1767AE; --accent-ink:#FFFFFF; --accent-soft:rgba(23,103,174,.10);
    --amber:#9A5A06; --teal:#0C7C6C; --good:#1C7A4B; --warn:#B4321F; --warn-soft:rgba(180,50,31,.08);
    --pa:#DCE7F4; --pb:#C4D6EB; --seam:#7C93B8; --ridgec:#B4321F; --hole:#FFFFFF;
    --thumbc:#FFFFFF; --glass:rgba(255,255,255,.82); --shadow:0 14px 34px rgba(16,24,32,.14),0 2px 6px rgba(16,24,32,.08);
  }
}
:root[data-theme="light"]{
  color-scheme:light; --thumbc:#FFFFFF;
  --bg:#F2F4F7; --glow:rgba(23,103,174,.07);
  --surface:#FFFFFF; --surface2:#F8FAFC; --raised:#EFF3F7; --sheen:rgba(255,255,255,0);
  --line:rgba(15,23,32,.08); --line2:rgba(15,23,32,.14);
  --fg:#0E141B; --muted:#5B6875; --faint:#8D99A6;
  --accent:#1767AE; --accent-ink:#FFFFFF; --accent-soft:rgba(23,103,174,.10);
  --amber:#9A5A06; --teal:#0C7C6C; --good:#1C7A4B; --warn:#B4321F; --warn-soft:rgba(180,50,31,.08);
  --pa:#DCE7F4; --pb:#C4D6EB; --seam:#7C93B8; --ridgec:#B4321F; --hole:#FFFFFF;
  --glass:rgba(255,255,255,.82); --shadow:0 14px 34px rgba(16,24,32,.14),0 2px 6px rgba(16,24,32,.08);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%) no-repeat,var(--bg);color:var(--fg);font:400 17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hide,[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(120px + env(safe-area-inset-bottom,0px))}

/* header */
.hd{display:grid;gap:14px;padding-block:10px 4px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--muted)}
.brand svg{width:30px;height:30px;flex:none}
.icons{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--fg);transition:transform .12s}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.title{margin:2px 0 0;font:800 38px/1 var(--f-display);font-stretch:85%;letter-spacing:-.01em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip b{font:700 16px/1 var(--f-display);font-stretch:90%;color:var(--fg);font-variant-numeric:tabular-nums}

/* segmented controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--raised);border:1px solid var(--line)}
.seg button{min-height:46px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;font-size:16px;padding:6px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--thumbc);color:var(--fg);box-shadow:0 1px 0 var(--line2) inset,0 4px 14px rgba(0,0,0,.18)}
.seg.big button{min-height:52px;font-size:17px}
.seg.big button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}

/* content */
.view{display:grid;gap:14px;margin-top:16px;animation:rise .24s ease-out}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,var(--sheen),transparent 40%),var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h h2{margin:0;font:700 19px/1.2 var(--f-body)}
.card-h span{font-size:14px;color:var(--muted)}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

.field{display:grid;gap:7px;min-width:0}
.field>span{font-size:14px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:54px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--raised);font-size:19px;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
select.inp{appearance:auto}
.unit{position:relative}
.unit .inp{padding-right:44px}
.unit::after{content:attr(data-u);position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.fi{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.fi .unit .inp{padding-left:12px;padding-right:30px}
.fi .unit::after{right:10px;font-size:14px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.mini>span{font-size:12px}
.mini .inp{min-height:48px;padding:8px 10px;font-size:17px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:18px;padding:14px;font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.25) inset;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--raised);color:var(--fg);border:1px solid var(--line2);box-shadow:none;font-weight:600}
.pill{min-height:44px;border:1px solid var(--line2);background:var(--raised);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600}
.link{border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;padding:0 4px}
.link.danger{color:var(--warn)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:20px}
.hero .big{margin:4px 0 0;white-space:nowrap;font:800 clamp(44px,13.5vw,64px)/.95 var(--f-display);font-stretch:80%;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .big small{font:600 18px var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:0}
.hero .sub2{margin:8px 0 0;font-size:15px;color:var(--muted)}
.thumb{width:104px;height:88px;border-radius:16px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:84%;height:84%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:800 28px/1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.t-accent .v{color:var(--accent)} .t-amber .v{color:var(--amber)} .t-teal .v{color:var(--teal)}
.callout{margin:0;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:15px}

/* lists */
.mlist{display:grid;margin:0;padding:0;list-style:none}
.mlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0;padding-top:2px}
.mlist .n{font-weight:600}
.mlist .d{grid-column:1;font-size:14px;color:var(--muted)}
.mlist .q{grid-row:1/span 2;grid-column:2;text-align:right;font:800 24px/1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.mlist .q small{display:block;font:500 12px var(--f-body);color:var(--muted);margin-top:3px}
.order{list-style:none;margin:0;padding:0;display:grid}
.order li{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.order li:first-child{border-top:0}
.order .oq{font-size:15px;color:var(--muted);min-width:4.6em}
.order .oq b{font:800 26px/1 var(--f-display);font-stretch:85%;color:var(--fg);margin-right:4px;font-variant-numeric:tabular-nums}
.order .oat{font-size:15px;color:var(--muted)}
.order .ol{font:600 21px/1 var(--f-mono);color:var(--accent)}
.cost{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cost b{font:800 36px/1 var(--f-display);font-stretch:85%;color:var(--good)}
.bars{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:76px minmax(0,1fr) 58px;gap:12px;align-items:center}
.bars .l{font:600 17px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.bars .track{height:10px;border-radius:6px;background:var(--raised);overflow:hidden}
.bars .fill{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--teal)))}
.bars .c{text-align:right;font:800 20px/1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.bars .c small{font:500 13px var(--f-body);color:var(--muted);margin-left:2px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;font-weight:700}
.total b{font:800 22px/1 var(--f-display);font-stretch:85%;color:var(--accent)}
details.fold{border-top:1px solid var(--line);padding-top:4px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:50px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details.fold .inner{display:grid;gap:10px;padding-bottom:6px}
.cuts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cuts li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cuts b{font:500 13px var(--f-mono);color:var(--muted)}
.cuts span{font:600 16px/1.2 var(--f-mono)}
.cuts small{flex-basis:100%;font-size:12px;color:var(--amber)}
.fh{margin:8px 0 0;font-weight:600;display:flex;align-items:center;gap:8px}
.code{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 7px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700}
.courses{display:grid;margin:0;padding:0;list-style:none}
.courses li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.courses i{font-style:normal;color:var(--muted);font-size:14px;font-weight:600}
.courses span{font:500 15px/1.5 var(--f-mono)}

/* editors */
.sub{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.sub-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub-h b{font:700 18px/1.1 var(--f-body)}
.erows{display:grid;gap:8px;counter-reset:edge}
.erow{display:grid;grid-template-columns:18px repeat(3,minmax(0,1fr)) 30px;gap:6px 8px;align-items:center;counter-increment:edge;padding-bottom:10px;border-bottom:1px solid var(--line)}
.erow>select:first-child{grid-column:2}
.erow>select:nth-child(3){grid-column:3/5}
.erow .fi{grid-column:2/4;grid-row:2}
.erow .ep{grid-column:4/6;grid-row:2}
.erow::before{content:counter(edge);font-size:13px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.erow .inp{min-height:48px;padding:8px;font-size:16px;border-radius:12px}
.x{border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;padding:0 6px}
.erow .x{font-size:22px;padding:0}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--warn);font-weight:600}
.status.ok{color:var(--good)}

/* empty state */
.empty{text-align:center;justify-items:center;padding:34px 22px}
.empty svg{width:54px;height:54px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:0;font:700 20px var(--f-body)}
.empty p{margin:0;color:var(--muted);max-width:32ch}

/* drawings */
.viewer{background:var(--surface2);border-radius:16px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:66vh;border:1px solid var(--line)}
.viewer svg{display:block;width:calc(100% * var(--z,1));height:auto;font-family:var(--f-display);font-weight:700;font-stretch:85%}
.viewer svg text{fill:var(--fg)}
.zoom{display:flex;gap:8px;align-items:center}
.zoom .pill{min-width:48px;font-size:19px;padding:4px 12px}
.zoom span{margin-left:auto;font-size:13px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:16px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
.wallpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.wallpick button{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--raised);color:var(--muted);font-weight:600;font-size:15px}
.wallpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* import */
.imp{border-style:dashed}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filebtn{cursor:pointer}
.filebtn.off{opacity:.45;pointer-events:none}
#impFile:focus-visible + .filebtn{outline:2px solid var(--accent);outline-offset:3px}
.imp .st{font-size:15px;color:var(--muted)}
.imp .st:empty{display:none}
.imp .st.err{color:var(--warn)}
.imp .st.ok{color:var(--good)}
.imp ul{margin:6px 0 0;padding-left:20px}
.ver{padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em}
.pdfbox{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.pdfhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pdfhead b{font-weight:700;overflow-wrap:anywhere}
.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg{display:grid;gap:6px;min-width:0}
.pgimg{display:block;width:100%;padding:0;border:2px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden;aspect-ratio:8.5/11;position:relative}
.pgimg canvas{display:block;width:100%;height:auto}
.pgimg .pn{position:absolute;left:6px;top:6px;padding:1px 7px;border-radius:7px;background:rgba(9,12,16,.75);color:#fff;font-size:12px;font-weight:700}
.pg.on .pgimg{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.use{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);color:var(--muted);font-size:14px;font-weight:600}
.pg.on .use,.use.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.pgview{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}
.pgview-h,.pgview-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.pgview-f{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.pgview-h b{font:800 22px/1 var(--f-display);font-stretch:85%}
.pgscroll{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--surface2)}
.pgscroll canvas{display:block;width:calc(100% * var(--z,1));height:auto;background:#fff}

/* tab bar */
.tabbar{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;height:70px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow)}
.tabbar button{border:0;background:none;border-radius:20px;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;transition:color .15s,background .2s}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* settings sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(4,7,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font:800 26px/1 var(--f-display);font-stretch:85%}

.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateX(-50%) translateY(14px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.copyout{width:100%;min-height:200px;font:14px/1.4 var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-tab="measure"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="m7 13 2 2M9.5 10.5l1.5 1.5M12 8l2 2M14.5 5.5l1.5 1.5"/></svg>Measure</button>
  <button data-tab="materials"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 3.5l8 4v9l-8 4-8-4z"/><path d="m4 7.5 8 4 8-4M12 11.5v9"/></svg>Materials</button>
  <button data-tab="cuts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h7"/><circle cx="18.5" cy="16.5" r="2.5"/></svg>Cut list</button>
  <button data-tab="layout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 12 5l9 14z"/><path d="M8.2 19 12 12.6 15.8 19M12 5v14"/></svg>Layout</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<!-- report import lives outside the views so the file input survives re-renders -->
<div class="card imp" id="imp" hidden>
  <p class="hint" style="color:var(--fg)"><strong>Import a HOVER or EagleView report.</strong> Pick the PDF, then choose which pages to read. EagleView roofs are rebuilt face by face straight from the PDF.</p>
  <input type="file" id="impFile" class="vh" multiple accept="application/pdf,.pdf,image/png,image/jpeg,image/webp">
  <label class="btn ghost filebtn" for="impFile" id="impBtn">Choose report or screenshots</label>
  <button class="pill hide" id="impStop">Stop</button>
  <div class="st" id="impSt" aria-live="polite">Getting import ready…</div>
  <div id="pdfBox" class="pdfbox" hidden></div>
</div>
<script>
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1900);}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

// ---------- roof layout engine: outline -> faces -> panels ----------
// Sections are walked edge by edge (N/E/S/W + length + eave|rake|wall). With one pitch per section,
// the roof over a rectilinear outline is its straight skeleton, which for right-angle outlines is the
// L-infinity distance to the eaves: a point belongs to the eave whose wavefront reaches it first.
const LDIR={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
function buildRoof(sections,cov,over){
  const R={secs:[],faces:[],area:0,eave:0,rake:0,wall:0,ridge:0,hips:0,valleys:0,panels:0,lf:0,clips:0,pitch:null};
  const H=cov/24;                                    // scan spacing: 24 lines per panel width
  (sections||[]).forEach((sec,si)=>{
    const S={name:sec.name||('Section '+(si+1)),ok:false,msg:'',note:''}; R.secs.push(S);
    const p=+sec.pitch||0, pf=Math.sqrt(1+(p/12)**2);
    const E=(sec.edges||[]).filter(e=>LDIR[e.d]&&+e.len>0);
    if(E.length<4){S.msg='Needs at least 4 edges.';return;}
    // each edge may carry its own pitch (the face that slopes down to it); otherwise the section's
    const PE=E.map(e=>+e.pitch>0?+e.pitch:p), PF=PE.map(q=>Math.sqrt(1+(q/12)**2));
    const L=E.map((e,i)=>e.t==='rake'?e.len/PF[i]:+e.len);   // rakes are entered along the slope, like the reports show them
    let gx=0,gy=0; E.forEach((e,i)=>{gx+=LDIR[e.d][0]*L[i];gy+=LDIR[e.d][1]*L[i];});
    const gap=(g,pos,neg)=>Math.abs(g)<.05?'':f2(Math.abs(g))+' ft '+(g>0?pos:neg);
    if(Math.abs(gx)>1.5||Math.abs(gy)>1.5){S.msg='Doesn’t close: the last edge ends '+[gap(gx,'east','west'),gap(gy,'south','north')].filter(Boolean).join(' and ')+' of the start.';return;}
    const fixed=[];                                   // report lengths are rounded, so absorb a small gap in the last edge on that axis
    for(const ax of [0,1]){const g=ax?gy:gx; if(Math.abs(g)<1e-6)continue;
      let i=E.length-1; while(i>=0&&LDIR[E[i].d][ax]===0)i--;
      if(i<0){S.msg='Doesn’t close.';return;}
      L[i]-=g*LDIR[E[i].d][ax]; if(L[i]<.05){S.msg='Doesn’t close.';return;}
      if(Math.abs(g)>=.05) fixed.push('edge '+(sec.edges.indexOf(E[i])+1)+' '+(g*LDIR[E[i].d][ax]<0?'+':'−')+f2(Math.abs(g))+' ft');
    }
    if(fixed.length) S.note='Adjusted '+fixed.join(', ')+' so the outline closes.';
    const V=[[+sec.x||0,+sec.y||0]];
    E.forEach((e,i)=>{const q=V[V.length-1];V.push([q[0]+LDIR[e.d][0]*L[i],q[1]+LDIR[e.d][1]*L[i]]);});
    V.pop();
    const inside=pt=>{let c=false;for(let i=0,j=V.length-1;i<V.length;j=i++){const a=V[i],b=V[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;};
    let area2=0; for(let i=0,j=V.length-1;i<V.length;j=i++) area2+=(V[j][0]+V[i][0])*(V[j][1]-V[i][1]);
    const orient=area2>0?1:-1;                        // which side of each edge is inside
    const edges=E.map((e,i)=>{const a=V[i],b=V[(i+1)%V.length],d=LDIR[e.d],ax=d[0]?0:1;
      const nrm=[-d[1]*orient,d[0]*orient];           // interior normal
      const mid=[(a[0]+b[0])/2+nrm[0]*1e-3,(a[1]+b[1])/2+nrm[1]*1e-3];
      if(!inside(mid)){nrm[0]*=-1;nrm[1]*=-1;}
      return {a,b,t:e.t||'eave',ax,nrm,len:L[i],p:PE[i],pf:PF[i]};});
    for(const e of edges){ if(e.t==='eave')R.eave+=e.len; else if(e.t==='rake')R.rake+=e.len*e.pf; else R.wall+=e.len; }
    // coplanar eaves (same line, same side) are one roof plane
    const G=[];
    // a plane grows past a reflex corner as fast as its neighbour's front moves, so remember the neighbour's slope at each end
    const kOf=(e,own)=>Math.max(1e-3,(e&&e.t==='eave'?e.p:own)/12);
    edges.forEach((e,i)=>{ if(e.t!=='eave')return;
      const c=e.ax===0?e.a[1]:e.a[0], n=e.ax===0?e.nrm[1]:e.nrm[0], lo=Math.min(e.a[e.ax],e.b[e.ax]), hi=Math.max(e.a[e.ax],e.b[e.ax]);
      const prev=edges[(i-1+edges.length)%edges.length], next=edges[(i+1)%edges.length], aLo=e.a[e.ax]<=e.b[e.ax];
      const kLo=kOf(aLo?prev:next,e.p), kHi=kOf(aLo?next:prev,e.p);
      let g=G.find(g=>g.ax===e.ax&&Math.abs(g.c-c)<1e-6&&g.n===n&&g.p===e.p); if(!g){g={ax:e.ax,c,n,p:e.p,k:Math.max(1e-3,e.p/12),pf:e.pf,segs:[]};G.push(g);} g.segs.push([lo,hi,kLo,kHi]); });
    if(!G.length){S.msg='Needs at least one eave.';return;}
    const toS=(g,P)=>g.ax===0?P[0]:P[1], toU=(g,P)=>((g.ax===0?P[1]:P[0])-g.c)*g.n;
    const toP=(g,s,u)=>g.ax===0?[s,g.c+g.n*u]:[g.c+g.n*u,s];
    function owner(P){
      if(!inside(P)) return -1;
      let best=-1,bv=Infinity,bd=Infinity;
      for(let k=0;k<G.length;k++){const g=G[k],u=toU(g,P); if(u<-1e-9)continue; const s=toS(g,P);
        let v=Infinity,dd=Infinity; for(const [lo,hi,kl,kh] of g.segs){const d=Math.max(0,lo-s,s-hi),w=Math.max(u*g.k,s<lo?(lo-s)*kl:s>hi?(s-hi)*kh:0); if(w<v||(w===v&&d<dd)){v=w;dd=d;}}
        if(v<bv-1e-9||(Math.abs(v-bv)<=1e-9&&dd<bd)){best=k;bv=v;bd=dd;}}
      return best;
    }
    const proj=(g,ax)=>V.map(q=>ax==='s'?toS(g,q):toU(g,q));
    const hAt=P=>{let v=Infinity;for(const g of G){const u=toU(g,P);if(u<-1e-9)continue;const s=toS(g,P);for(const [lo,hi,kl,kh] of g.segs)v=Math.min(v,Math.max(u*g.k,s<lo?(lo-s)*kl:s>hi?(s-hi)*kh:0));}return v;};
    const xs=V.map(q=>q[0]),ys=V.map(q=>q[1]); let hTop=0;
    for(let x=Math.min(...xs);x<=Math.max(...xs);x+=.5)for(let y=Math.min(...ys);y<=Math.max(...ys);y+=.5){const P=[x,y];if(inside(P))hTop=Math.max(hTop,hAt(P));}
    G.forEach((g,k)=>{
      const us=proj(g,'u'), umax=Math.min(Math.max(...us),hTop/g.k+.75), ss=proj(g,'s'), s0=Math.min(...ss), s1=Math.max(...ss);
      const mine=(s,u)=>owner(toP(g,s,u))===k;
      function line(s){
        const out=[],du=1/4; let inA=null, prev=1e-6, pin=mine(s,prev); if(pin)inA=prev;
        const edge=(lo,hi,want)=>{for(let i=0;i<22;i++){const m=(lo+hi)/2; if(mine(s,m)===want)hi=m; else lo=m;}return hi;};
        for(let u=du;u<umax+du;u+=du){const uu=Math.min(u,umax-1e-6),cur=mine(s,uu);
          if(cur!==pin){const x=edge(prev,uu,cur); if(cur)inA=x; else {out.push([inA,x]);inA=null;} pin=cur;}
          prev=uu; if(uu>=umax-1e-6)break;}
        if(inA!=null) out.push([inA,prev]);
        return out.filter(([a,b])=>b-a>1e-4);
      }
      // find where this plane starts and ends across the eave direction
      const has=s=>line(s).length>0;
      let a0=null,a1=null; const ok=[];
      const C=cov/3; for(let s=s0+1e-6;s<s1;s+=C){ if(has(s)){ if(a0==null)a0=s; a1=s; } }
      if(a0==null) return;
      const refine=(out,inn)=>{for(let i=0;i<24;i++){const m=(out+inn)/2; if(has(m))inn=m; else out=m;}return inn;};
      { const o=Math.max(s0+1e-6,a0-C); a0=has(o)?o:refine(o,a0); }
      { const o=Math.min(s1-1e-6,a1+C); a1=has(o)?o:refine(o,a1); }
      // fine scan aligned to panel edges, then join intervals into connected pieces
      const comps=[]; let last=[];
      const n=Math.max(1,Math.ceil((a1-a0)/H-1e-9));
      for(let j=0;j<=n;j++){ const s=j===n?a1:a0+j*H, ivs=line(s), now=[];
        for(const [a,b] of ivs){ const pc=last.find(q=>q.a<b+1.5*H&&a<q.b+1.5*H);
          let c=pc?pc.c:null; if(!c){c={rows:[]};comps.push(c);}
          const r=c.rows[c.rows.length-1]; if(r&&r.j===j){r.a=Math.min(r.a,a);r.b=Math.max(r.b,b);} else c.rows.push({j,s,a,b});
          now.push({a,b,c}); }
        last=now; }
      for(const c of comps){ if(c.rows.length<2) continue;
        const pf=g.pf;                                // this face's own slope
        const face={sec:si,pf,g,rows:c.rows,dir:g.ax===0?(g.n>0?'north':'south'):(g.n>0?'west':'east'),panels:[],toP:(s,u)=>toP(g,s,u)};
        const rows=c.rows, j0=rows[0].j, sA=rows[0].s, sB=rows[rows.length-1].s;
        // corners that fall between scan lines: extend the two neighbouring slopes to where they meet
        const peak=(side,sign)=>{const out=[];for(let i=1;i+2<rows.length;i++){const l=(rows[i][side]-rows[i-1][side])/(rows[i].s-rows[i-1].s), r=(rows[i+2][side]-rows[i+1][side])/(rows[i+2].s-rows[i+1].s);
          if(sign*l>1e-6&&sign*r<-1e-6){const t=(rows[i+1][side]-rows[i][side]-r*(rows[i+1].s-rows[i].s))/(l-r); if(t>0&&t<rows[i+1].s-rows[i].s) out.push({s:rows[i].s+t,v:rows[i][side]+l*t});}}return out;};
        const tops=peak('b',1), bots=peak('a',-1);
        for(let k2=0;sA+k2*cov<sB-.125;k2++){
          const lo=sA+k2*cov, hi=Math.min(sB,lo+cov), R2=rows.filter(r=>r.s>=lo-1e-6&&r.s<=hi+1e-6);
          if(!R2.length) continue;
          let umin=Math.min(...R2.map(r=>r.a)), umax2=Math.max(...R2.map(r=>r.b));
          for(const t of tops) if(t.s>lo&&t.s<hi) umax2=Math.max(umax2,t.v);
          for(const t of bots) if(t.s>lo&&t.s<hi) umin=Math.min(umin,t.v);
          const eaveEnd=umin<.01, len=(umax2-umin)*pf+(eaveEnd?over:0), inch=Math.ceil(len*12-1e-6);
          const poly=[...R2.map(r=>toP(g,r.s,r.a)),...R2.slice().reverse().map(r=>toP(g,r.s,r.b))];
          face.panels.push({lo,hi,umin,umax:umax2,inch,rip:hi-lo<cov-1e-3?Math.round((hi-lo)*12*4)/4:0,poly,eave:eaveEnd});
        }
        face.sliver=(sB-sA)%cov>1e-4&&(sB-sA)%cov<=.125?Math.round(((sB-sA)%cov)*48)/4:0;
        // area and the lines between faces (each shared line is counted from both sides, so halve later)
        let fa=0; face.lines={ridge:0,hip:0,valley:0};
        const onOutline=P=>edges.some(e=>{const ax=e.ax,o=1-ax,lo2=Math.min(e.a[ax],e.b[ax]),hi2=Math.max(e.a[ax],e.b[ax]);return Math.abs(P[o]-e.a[o])<.02&&P[ax]>lo2-.02&&P[ax]<hi2+.02;});
        for(let i=0;i+1<rows.length;i++){const r=rows[i],q=rows[i+1],ds=q.s-r.s;
          fa+=ds*((r.b-r.a)+(q.b-q.a))/2;
          const segLen=(d1,d2)=>Math.sqrt(ds*ds+((d2-d1)*pf)**2);
          const mid=(side)=>toP(g,(r.s+q.s)/2,(r[side]+q[side])/2);
          if((r.a>.01||q.a>.01)&&!onOutline(mid('a'))) face.lines.valley+=segLen(r.a,q.a);
          if(!onOutline(mid('b'))){ if(Math.abs(q.b-r.b)<.5*ds) face.lines.ridge+=segLen(r.b,q.b); else face.lines.hip+=segLen(r.b,q.b);} }
        face.area=fa*pf;
        face.cx=(sA+sB)/2;
        R.faces.push(face);
      }
    });
    S.ok=true; S.V=V; S.edges=edges; S.pitch=p;
    for(const g of G) R.pitch=R.pitch==null?g.p:Math.min(R.pitch,g.p);
  });
  // codes A, B, C… in reading order (top to bottom, then left to right)
  const cen=fc=>{const P=fc.rows.map(r=>fc.toP(r.s,(r.a+r.b)/2));return [P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];};
  R.faces.forEach(fc=>fc.c=cen(fc));
  R.faces.sort((x,y)=>x.sec-y.sec||Math.round(x.c[1])-Math.round(y.c[1])||x.c[0]-y.c[0]);
  R.faces.forEach((fc,i)=>{fc.code=i<26?String.fromCharCode(65+i):String.fromCharCode(64+Math.floor(i/26))+String.fromCharCode(65+i%26);
    fc.panels.forEach((p,j)=>{p.code=fc.code+(j+1); R.panels++; R.lf+=p.inch/12; R.clips+=Math.ceil(p.inch/24)+1;});
    R.area+=fc.area; R.ridge+=fc.lines.ridge/2; R.hips+=fc.lines.hip/2; R.valleys+=fc.lines.valley/2;});
  return R;
}
function f2(x){return (Math.round(x*10)/10).toString();}
function ftIn(inch){return Math.floor(inch/12)+"'"+(inch%12)+'"';}

// ---------- siding engine: walls -> courses -> plank pieces ----------
// Inches throughout. Each wall is a rectangle with an optional gable on top; openings are placed
// by their distance from the wall's left edge and from the bottom of the siding.
function buildSiding(walls,expIn,plankIn){
  const S={walls:[],gross:0,open:0,net:0,pieces:[],planks:0,starter:0,openTrim:0,err:[]};
  const q=x=>Math.round(x*4)/4;                                   // cut to the 1/4"
  (walls||[]).forEach((w,wi)=>{
    const W=(+w.w||0)*12, H=(+w.h||0)*12, P=(+w.peak||0)*12, T=H+P;
    const name=w.name||('Wall '+(wi+1)), out={name,W,H,P,courses:[],open:[],ok:false,msg:''};
    S.walls.push(out);
    if(!(W>0&&H>0)){out.msg='Enter the wall width and height.';return;}
    const ops=(w.open||[]).map((o,oi)=>{const x0=(+o.x||0)*12,y0=o.t==='door'?0:(+o.y||0)*12;
      return {t:o.t==='door'?'door':'window',x0,x1:x0+(+o.w||0)*12,y0,y1:y0+(+o.h||0)*12,code:(o.t==='door'?'D':'W')+(oi+1)};}).filter(o=>o.x1>o.x0&&o.y1>o.y0);
    for(const o of ops){ if(o.x0<0||o.x1>W+.01||o.y1>T+.01) out.msg='An opening sits past the edge of '+name+'. Check its position.'; }
    out.open=ops;
    const gross=W*H+W*P/2, oa=ops.reduce((a,o)=>a+(Math.min(o.x1,W)-Math.max(o.x0,0))*(o.y1-o.y0),0);
    S.gross+=gross/144; S.open+=oa/144; S.starter+=W;
    for(const o of ops) S.openTrim+=o.t==='door'?(o.x1-o.x0)+2*(o.y1-o.y0):2*(o.x1-o.x0)+2*(o.y1-o.y0);
    const n=Math.ceil(T/expIn-1e-6);
    for(let i=0;i<n;i++){
      const y0=i*expIn, y1=Math.min(T,(i+1)*expIn);
      // width of the wall at the bottom of this course (the long point for gable courses)
      let a=0,b=W,angled=false;
      if(y0>=H-1e-6){ if(!(P>0)) break; const g=W*(1-(y0-H)/P); a=(W-g)/2; b=(W+g)/2; angled=true; }
      else if(y1>H+1e-6&&P>0) angled=true;
      if(b-a<1) continue;
      const gaps=[], notch=[];
      for(const o of ops){ if(o.y0<y1-1e-6&&o.y1>y0+1e-6){ (o.y0<=y0+.5&&o.y1>=y1-.5?gaps:notch).push(o); } }
      gaps.sort((p,r)=>p.x0-r.x0);
      const segs=[]; let x=a;
      for(const o of gaps){ const g0=Math.max(a,o.x0), g1=Math.min(b,o.x1); if(g1<=x) continue; if(g0>x) segs.push([x,g0]); x=Math.max(x,g1); }
      if(x<b) segs.push([x,b]);
      const course={i:i+1,y0,y1,pieces:[],rip:y1-y0<expIn-.01&&!angled?q(y1-y0):0};   // top course ripped to fit under the soffit
      for(const [s0,s1] of segs){
        if(s1-s0<.5) continue;
        // stagger joints: every other course starts with a half plank, unless that leaves a sliver at the end
        const L=s1-s0, plan=stag=>{const out=[];let r=L;if(stag&&r>plankIn){out.push(plankIn/2);r-=plankIn/2;}while(r>.01){const l=Math.min(plankIn,r);out.push(l);r-=l;}return out;};
        let lens=plan(i%2===1); if(lens.length>1&&lens[lens.length-1]<24) lens=plan(false);
        if(lens.length>1&&lens[lens.length-1]<24){const k=lens.length-1,d=24-lens[k];lens[k-1]-=d;lens[k]=24;}   // no piece shorter than 2 ft
        let cut=s0;
        for(const len of lens){
          const x0=cut,x1=cut+len, nt=notch.filter(o=>o.x0<x1&&o.x1>x0).map(o=>o.code);
          const p={wall:wi,course:i+1,x0,x1,len:q(len),full:Math.abs(len-plankIn)<.01,
            ends:angled&&((Math.abs(x0-a)<.01)||(Math.abs(x1-b)<.01))?'angle':'',notch:nt};
          course.pieces.push(p); S.pieces.push(p); cut=x1;
        }
      }
      if(course.pieces.length) out.courses.push(course);
    }
    out.ok=!out.msg;
  });
  S.net=Math.max(0,S.gross-S.open);

  // ---------- roof: measure ----------
  function defWaste(){return st.mat==='metal'?(st.method==='report'&&!st.model?10:5):(st.method==='simple'?(st.style==='hip'?15:10):12);}

  function roofMeasure(v){

  // ---------- roof: results ----------
  function simpleSecs(){
    const p=+st.pitch||0, pf=Math.sqrt(1+(p/12)**2), L=+st.L||0, W=+st.W||0;
    return [{name:'Roof',pitch:p,edges:st.style==='gable'
      ?[{d:'E',len:L,t:'eave'},{d:'S',len:W*pf,t:'rake'},{d:'W',len:L,t:'eave'},{d:'N',len:W*pf,t:'rake'}]
      :[{d:'E',len:L,t:'eave'},{d:'S',len:W,t:'eave'},{d:'W',len:L,t:'eave'},{d:'N',len:W,t:'eave'}]}];
  }
  let roofKey='', roofR=null;
  function roofCalc(){
    const metal=st.mat==='metal', [covIn,kind]=st.panel.split('|'), cov=+covIn, covFt=cov/12, ss=metal&&kind==='ss', over=(+st.over||0)/12, C=st.cov;
    let g, R=null;
    if(st.method==='report'){
      const q=st.rep; g={area:+q.area||0,pitch:+q.pitch||0,eave:+q.eave||0,rake:+q.rake||0,ridge:+q.ridge||0,hips:+q.hip||0,valleys:+q.valley||0,wall:+q.flash||0};
      if(!(g.area>0)&&!st.model) return {err:'Enter the total roof area from the report, or import the report.'};
      if(st.model&&st.model.faces&&st.model.faces.length){
        const key=JSON.stringify([st.model,q,covFt,over]); if(key!==roofKey){roofKey=key;roofR=facetRoof(st.model,q,covFt,over);} R=roofR;
        if(R.faces.length) g={area:R.area,pitch:R.pitch,eave:R.eave,rake:R.rake,ridge:R.ridge,hips:R.hips,valleys:R.valleys,wall:R.wall}; else R=null;
      }
    } else {
      if(st.method==='simple'&&!(st.L>0&&st.W>0)) return {err:'Enter the roof length and width.'};
      const secs=st.method==='simple'?simpleSecs():st.sections, key=JSON.stringify([secs,covFt,over]);
      if(key!==roofKey){roofKey=key;roofR=buildRoof(secs,covFt,over);} R=roofR;
      const bad=R.secs.find(x=>!x.ok);
      if(bad) return {err:bad.name+': '+bad.msg+' Fix it on the measurements screen.'};
      if(!R.faces.length) return {err:'Enter the roof outline.'};
      g={area:R.area,pitch:R.pitch,eave:R.eave,rake:R.rake,ridge:R.ridge,hips:R.hips,valleys:R.valleys,wall:R.wall};
    }
    const w=1+(+st.waste||0)/100, sqW=g.area*w/100, rows=[];
    const lowShingle=!metal&&g.pitch>=2&&g.pitch<4;
    const under=['Underlayment',Math.ceil(g.area*1.1*(lowShingle?2:1)/100/Math.max(.1,+C.under||10))+' rolls',(ss?'High-temp synthetic. ':'')+(lowShingle?'2 layers for low slope. ':'')+f(C.under)+' squares per roll'];
    const iceLF=g.eave*Math.max(0,Math.round(+C.iceRows||0))+g.valleys;
    const ice=['Ice and water shield',Math.ceil(iceLF/Math.max(1,+C.ice||66))+' rolls',f(iceLF)+' ft at eaves and valleys'];
    let cost=null, cut=null, sum={};
    if(!metal){
      const nails=Math.ceil(sqW*67)*(+st.nails||4), box=Math.max(1,+C.nailsBox||7200); sum={bundles:Math.ceil(sqW*3)};
      rows.push(['Shingles',Math.ceil(sqW*3)+' bundles','3 bundles per square, waste included'],
        ['Starter strip',Math.ceil((g.eave+g.rake)/Math.max(1,+C.start||110))+' bundles',f(g.eave+g.rake)+' ft of eaves and rakes'],
        ['Ridge cap',Math.ceil((g.ridge+g.hips)/Math.max(1,+C.ridge||25))+' bundles',f(g.ridge+g.hips)+' ft of ridges and hips'],
        ['Drip edge',Math.ceil((g.eave+g.rake)*1.05/10)+' pcs','10 ft pieces'],
        ['Headwall flashing',g.wall?Math.ceil(g.wall*1.05/10)+' pcs':null,f(g.wall)+' ft'],
        under,ice,['Coil nails',Math.max(1,Math.ceil(nails/box))+' box'+(nails>box?'es':''),'about '+f(nails)+' nails']);
    } else {
      const trimLen=Math.max(1,+C.trim||10); let trimPcs=0;
      const pcs=(k,lf,what)=>{if(!(lf>0))return [k,null];const n=Math.ceil(lf*1.05/trimLen);trimPcs+=n;return [k,n+' pcs',f(lf)+' ft'+(what?', '+what:'')];};
      let panels, totalLF, clips=0, screwBags=0;
      if(R){panels=R.panels;totalLF=R.lf;clips=ss?R.clips:0;cut=engineItems(R);}
      else {totalLF=g.area*w/covFt;clips=ss?Math.ceil(totalLF/2)+Math.ceil(g.eave/covFt):0;}
      const name=PANELS.find(p=>p[0]===st.panel)[1]; sum={panels:R?panels:0,lf:totalLF};
      rows.push(R?['Panels',panels+' pcs',name+', '+f(totalLF)+' ft, cut to length (lengths listed above)']:['Panels',f(Math.ceil(totalLF/10)*10)+' ft',name+', waste included']);
      rows.push(pcs('Eave trim',g.eave),pcs('Rake trim',g.rake),pcs('Ridge cap',g.ridge),pcs('Hip cap',g.hips),pcs('Valley flashing',g.valleys),pcs('Headwall flashing',g.wall));
      if(ss){
        rows.push(pcs('Z-closure',2*g.ridge+2*g.hips),['Panel clips','about '+f(clips),'24" apart'],['Pancake screws','about '+f(clips),'1 per clip']);
      } else {
        const screws=Math.ceil(sqW*(+C.screws||80)); screwBags=Math.ceil(screws/250);
        rows.push(['Inside closures',Math.ceil(g.eave/covFt)+' pcs','at the eaves'],
          ['Outside closures',(g.ridge+g.hips)?Math.ceil(2*(g.ridge+g.hips)/covFt)+' pcs':null,'at ridges and hips'],
          ['Panel screws',screwBags+' bags','about '+f(screws)+', 250 per bag']);
      }
      rows.push(under,ice);
      for(const r of rows) if(r[0].includes('trim')||r[0].includes('cap')||r[0].includes('flashing')||r[0]==='Z-closure') if(r[1]) r[2]+=', '+f(trimLen)+' ft pieces';
      const P=st.price, cP=totalLF*(+P.panel||0), cT=trimPcs*trimLen*(+P.trim||0), cS=screwBags*(+P.screw||0);
      if(cP+cT+cS>0) cost={total:cP+cT+cS,ss,lines:[['Panels',cP],['Trim',cT],['Screws',cS]].filter(x=>x[1]>0)};
    }
    return {...sum,area:g.area,sqW,warn:slopeWarn(g.pitch,ss),rows:rows.filter(r=>r&&r[1]!=null),cut,R,cost,metal};
  }
  const money=x=>'$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  function byLength(R){const m=new Map();for(const fc of R.faces)for(const p of fc.panels)m.set(p.inch,(m.get(p.inch)||0)+1);return [...m].sort((a,b)=>b[0]-a[0]);}
  const engineItems=R=>({byLen:byLength(R),faces:R.faces.filter(fc=>fc.panels.length).map(fc=>({code:fc.code,dir:fc.dir,name:R.secs.length>1?R.secs[fc.sec].name:'',pieces:fc.panels}))});

  // ---------- thumbnails ----------
  function thumbRoof(R){
    const box=el('div','thumb'), s=sv('svg',{viewBox:'0 0 100 80','aria-hidden':'true'});

    put(q,'area',T.area); if(T.pitch>0) q.pitch=nearPitch(T.pitch);
    for(const [k,tk] of [['eave','eave'],['rake','rake'],['ridge','ridge'],['hip','hip'],['valley','valley'],['flash','flash']]) put(q,k,T[tk]);
    st.model={faces:M.faces.map(f=>({pts:f.pts.map(p=>p.map(v=>Math.round(v*1000)/1000)),pitch:f.pitch,eave:f.eave}))};
    st.method='report'; st.sections=[blankSection(q.pitch)]; if(!st.wasteEdited||st.mat!=='shingle') autoWaste();
    const by={}; for(const f of M.faces) by[f.pitch]=(by[f.pitch]||0)+1;
    done.push('Rebuilt the roof from the pitch diagram on page '+page+': '+M.faces.length+' faces ('+Object.keys(by).sort((a,b)=>a-b).map(p=>by[p]+' at '+p+'/12').join(', ')+'). Your panel list is on Materials.');
    if(T.byPitch.length>1) done.push('Area at each pitch matches the report within '+f(M.err)+' sq ft.');
    done.push('Roof area '+f(T.area)+' ft²'+(T.pitch?', predominant pitch '+q.pitch+'/12':''));
    const got=[['eaves',T.eave],['rakes',T.rake],['ridges',T.ridge],['hips',T.hip],['valleys',T.valley],['flashing',T.flash]].filter(x=>x[1]>0).map(x=>x[0]+' '+f(x[1]));
    if(got.length) done.push(got.join(', ')+' ft');
    st.trade='roof'; st.tab='measure'; save(); render();
    const s2=$('impSt'); s2.className='st ok'; s2.textContent='Read straight from the EagleView PDF. Check these against the report:';
    const ul=el('ul'); for(const x of done) ul.append(el('li',null,x)); s2.append(ul);
  }
  async function readSelected(){
    if(!pdf||!pdf.sel.size) return;
    setSt('Reading the roof from the report\u2026');
    const vec=await readVector(); if(vec){ applyVector(vec); return; }
    if(!sample){ if(!hasClaude){ setSt('Couldn\u2019t find an EagleView pitch diagram with the roof\u2019s faces in this PDF. Type the totals below, or trace the roof.','err'); return; } setSt(importPending?'The import is still starting up. Try again in a few seconds.':(importErr||errMsg('no_sample')),'err'); return; }
    const pages=[...pdf.sel].sort((a,b)=>a-b), canImg=!!(caps&&caps.images);
    await send(async()=>{
      setSt('Reading page'+(pages.length>1?'s ':' ')+pages.join(', ')+'\u2026 this can take up to a minute.');
      const text=pages.map(i=>'\n--- Page '+i+' of '+pdf.n+' ---\n'+pdf.text[i]).join('');
      const images=[]; if(canImg) for(const i of pages) images.push(await new Promise(async r=>(await renderPage(i,1600)).toBlob(r,'image/jpeg',0.85)));
      return {text:text.replace(/\s|---|Page \d+ of \d+/g,'').length>40?text:'',images};
    });
  }
  async function send(prepare){
    ctl=new AbortController(); $('impStop').classList.remove('hide'); $('impBtn').classList.add('off'); const go=$('pdfGo'); if(go) go.disabled=true;
    try{
      const {text,images}=await prepare();
      if(!text&&!images.length){ setSt('Nothing readable on those pages. Pick other pages, or use screenshots.','err'); return; }
      const input=PROMPT+(text?'\n\nREPORT TEXT:\n'+text.slice(0,120000):'')+(images.length?'\n\nThe selected report page'+(images.length>1?'s are':' is')+' attached as image'+(images.length>1?'s':'')+'.':'');
      const opts={signal:ctl.signal}; if(images.length) opts.images=images;
      apply(await sample.json(input,opts));
    }catch(e){ if(e&&e.code==='cancelled') setSt('Stopped.'); else setSt(errFull(e),'err'); }
    finally{ $('impStop').classList.add('hide'); $('impBtn').classList.remove('off'); $('impFile').value=''; if(pdf&&$('pdfGo')) syncPdfBox(); }
  }
  $('impFile').onchange=()=>{const files=[...$('impFile').files], p=files.find(x=>x.type==='application/pdf'||/\.pdf$/i.test(x.name));
    if(p){ openPdf(p); $('impFile').value=''; } else runImport(files);};
  async function initImport(){
    try{
      if(!hasClaude){ $('impFile').accept='application/pdf,.pdf'; $('impBtn').textContent='Choose the PDF report'; setSt('EagleView PDFs are read right here on your phone.'); return; }
      sample=await window.claude.use('sample');
      if(!sample){ importErr=errMsg('no_sample'); setSt(importErr,'err'); return; }
      importReady=true;
      caps=await sample.limits().catch(()=>null);
      if(caps&&caps.images){ $('impFile').accept='application/pdf,.pdf,'+caps.images.mediaTypes.join(','); setSt(''); }
      else { $('impFile').accept='application/pdf,.pdf'; $('impBtn').textContent='Choose the PDF report'; setSt('Screenshots aren\u2019t supported here, but the PDF works.'); }
    }catch(e){ importErr=errFull(e); setSt(importErr,'err'); }
    finally{ importPending=false; }
  }
  window.addEventListener('pagehide',save);
  load(); render(); initImport();
})();
</script>
